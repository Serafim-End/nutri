# Alembic configuration for NutriMatch
# Database URL is read from environment variable DATABASE_URL

[alembic]
# Path to migration scripts
script_location = %(here)s

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# Timezone for file generation (UTC for consistency)
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to true for 'offline' mode (generate SQL without connecting)
# offline = false

# NOTE: sqlalchemy.url is NOT set here - it's read from DATABASE_URL
# environment variable via env.py. This prevents hardcoded credentials.
# sqlalchemy.url = 

[post_write_hooks]
# Run black on newly generated revision files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
