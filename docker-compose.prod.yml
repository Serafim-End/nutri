# =============================================================================
# Production Docker Compose
# =============================================================================
# 
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   (or use: make up)
#
# Prerequisites:
#   1. Copy .env.prod.example to .env.prod and fill in values
#   2. Configure DNS in Cloudflare pointing to your server
#   3. Enable Cloudflare SSL (Full or Full Strict mode)
#
# Services exposed through nginx reverse proxy (Cloudflare handles HTTPS):
#   - nginx:        http://localhost:80 -> routes by domain
#     - web.nutrutioncoach.com  -> admin_panel:3001
#     - api.nutrutioncoach.com  -> backend:8000
#     - tma.nutrutioncoach.com  -> client:3000
#     - bot.nutrutioncoach.com  -> telegram_bot:8081
#
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: nutri-postgres
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Check that postgres is ready (uses env vars from container)
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nutri-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Nginx Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: nutri-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      client:
        condition: service_healthy
      admin_panel:
        condition: service_healthy
      telegram_bot:
        condition: service_started
    networks:
      - nutri-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Backend API (Flask + Gunicorn)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutri-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env.prod
    volumes:
      - media_data:/app/media
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s  # Allow time for DB wait + migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nutri-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Client Mini App (React + Nginx)
  # ===========================================================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.nutrutioncoach.com/api}
    container_name: nutri-client
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nutri-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Admin Panel (React + Nginx)
  # ===========================================================================
  admin_panel:
    build:
      context: ./apps/admin_panel
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.nutrutioncoach.com/api}
    container_name: nutri-admin
    restart: unless-stopped
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nutri-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Telegram Bot (aiogram v3)
  # ===========================================================================
  telegram_bot:
    build:
      context: ./apps/telegram_bot
      dockerfile: Dockerfile
    container_name: nutri-bot
    restart: unless-stopped
    expose:
      - "8081"
    env_file:
      - .env.prod
    environment:
      - TELEGRAM_MODE=${TELEGRAM_MODE:-polling}
      - WEBHOOK_PORT=8081
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PATH=/webhook
      - BACKEND_URL=http://backend:8000
      - PUBLIC_BACKEND_URL=https://api.nutrutioncoach.com
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nutri-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  media_data:

networks:
  nutri-network:
    driver: bridge
