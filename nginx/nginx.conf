# =============================================================================
# Production Nginx Reverse Proxy
# =============================================================================
# Routes requests by domain:
#   - web.nutrutioncoach.com  -> admin_panel:3001
#   - api.nutrutioncoach.com  -> backend:8000
#   - tma.nutrutioncoach.com  -> client:3000
#   - bot.nutrutioncoach.com  -> telegram_bot:8081
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # =========================================================================
    # Admin Panel - web.nutrutioncoach.com
    # =========================================================================
    server {
        listen 80;
        server_name web.nutrutioncoach.com;

        location / {
            proxy_pass http://admin_panel:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # =========================================================================
    # Backend API - api.nutrutioncoach.com
    # =========================================================================
    server {
        listen 80;
        server_name api.nutrutioncoach.com;

        location / {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =========================================================================
    # Telegram Mini App - tma.nutrutioncoach.com
    # =========================================================================
    server {
        listen 80;
        server_name tma.nutrutioncoach.com;

        location / {
            proxy_pass http://client:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # =========================================================================
    # Telegram Bot - bot.nutrutioncoach.com
    # =========================================================================
    server {
        listen 80;
        server_name bot.nutrutioncoach.com;

        location / {
            proxy_pass http://telegram_bot:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

